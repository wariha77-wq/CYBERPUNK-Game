<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBERPUNK 2086 — Mission Deployment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #05070a;
      color: #f8fafc;
      overflow: hidden;
    }

    .font-display { font-family: 'Cinzel', serif; }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

    .glow-btn {
      box-shadow: 0 0 32px rgba(56, 189, 248, 0.55), inset 0 0 14px rgba(255, 255, 255, 0.35);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glow-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 48px rgba(56, 189, 248, 0.85), inset 0 0 18px rgba(255, 255, 255, 0.5);
    }

    .glow-btn:active {
      transform: translateY(1px) scale(0.99);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeSlideUp 0.5s ease-out forwards; }
  </style>
</head>
<body class="relative w-screen h-screen select-none">

  <canvas id="bg-canvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>
  <div class="fixed inset-0 z-10 bg-gradient-to-t from-slate-950/90 via-slate-950/40 to-slate-950/80 pointer-events-none"></div>

  <!-- Minimal Top Bar -->
  <header class="relative z-20 flex justify-between items-center p-6">
    <a
      href="main.html"
      class="px-4 py-2 rounded-full border border-slate-800 bg-slate-950/60 backdrop-blur-md text-xs font-mono-tech uppercase tracking-wider text-slate-400 hover:text-white hover:border-sky-400/50 transition"
    >
      &larr; Main Menu
    </a>

    <span class="font-mono-tech text-xs tracking-widest uppercase text-slate-500">
      CYBERPUNK 2086 // OPERATOR 07
    </span>
  </header>

  <!-- Centered Deployment Splash -->
  <main class="relative z-20 flex flex-col items-center justify-center h-[calc(100vh-140px)] px-4 text-center">
    <div class="max-w-xl animate-in">
      <p id="deploy-eyebrow" class="font-mono-tech text-xs sm:text-sm uppercase tracking-[0.42em] text-sky-400 mb-3">
        DEPLOYMENT AUTHORIZED
      </p>

      <h1 id="deploy-title" class="font-display text-5xl sm:text-7xl font-black tracking-wider text-white mb-4 drop-shadow-[0_4px_24px_rgba(56,189,248,0.35)]">
        MISSION 01
      </h1>

      <h2 id="deploy-subtitle" class="text-lg sm:text-2xl font-bold text-slate-100 tracking-wide uppercase mb-6">
        THE FIRST BREACH — SECTOR 01
      </h2>

      <p id="deploy-objective" class="text-sm sm:text-base text-slate-300 leading-relaxed max-w-lg mx-auto mb-10">
        Objective: Audit suspicious <span class="text-sky-400 font-semibold">Municipal System Logs</span>, identify the anomalous process, and isolate the <span class="text-sky-400 font-semibold">First Breach</span>.
      </p>

      <button
        id="start-mission-btn"
        class="glow-btn bg-gradient-to-r from-sky-500 to-cyan-400 text-slate-950 font-extrabold text-sm sm:text-base tracking-[0.22em] uppercase px-14 py-4 rounded-full cursor-pointer"
      >
        START MISSION 01
      </button>
    </div>
  </main>

  <script>
 const DEPLOYMENTS = {
      "01": {
        eyebrow: "DEPLOYMENT AUTHORIZED",
        title: "MISSION 01",
        subtitle: "THE FIRST BREACH — SECTOR 01",
        objective: 'Objective: Audit suspicious <span class="text-sky-400 font-semibold">Central Network Logs</span>, identify the anomalous access record, and isolate the <span class="text-sky-400 font-semibold">External Intruder</span>.',
        btnText: "START MISSION 01"
      },
      "02": {
        eyebrow: "DEPLOYMENT AUTHORIZED",
        title: "MISSION 02",
        subtitle: "THE DEADLOCK PROTOCOL — RELAY 09",
        objective: 'Objective: Trace intercepted <span class="text-sky-400 font-semibold">Even-Parity Signals</span>, reconstruct corrupted data fragments, and verify the <span class="text-sky-400 font-semibold">Original Authorization Source</span>.',
        btnText: "START MISSION 02"
      },
      "03": {
        eyebrow: "DEPLOYMENT AUTHORIZED",
        title: "MISSION 03",
        subtitle: "THE FALSE FACE — CPU CORE",
        objective: 'Objective: Resolve low-level <span class="text-sky-400 font-semibold">x86 Register & Memory Vectors</span> to break the processor conflict and restore <span class="text-sky-400 font-semibold">Execution Control</span>.',
        btnText: "START MISSION 03"
      },
      "04": {
        eyebrow: "DEPLOYMENT AUTHORIZED",
        title: "MISSION 04",
        subtitle: "THE BROKEN PROTOCOL — FIREWALL 04",
        objective: 'Objective: Restore damaged <span class="text-sky-400 font-semibold">System Dependencies</span> in boot order and re-establish <span class="text-sky-400 font-semibold">Network Communication</span>.',
        btnText: "START MISSION 04"
      },
      "05": {
        eyebrow: "FINAL DEPLOYMENT AUTHORIZED",
        title: "MISSION 05",
        subtitle: "THE LAST PROTOCOL — CENTRAL MAINFRAME",
        objective: 'Objective: Verify override authorization, restore the <span class="text-sky-400 font-semibold">Approved System Backup</span>, and reclaim <span class="text-sky-400 font-semibold">Human Control</span>.',
        btnText: "START MISSION 05"
      }
    };

    const savedMission = sessionStorage.getItem("cp2086_mission") || "01";
    const missionId = DEPLOYMENTS[savedMission] ? savedMission : "01";
    sessionStorage.setItem("cp2086_mission", missionId);
    const data = DEPLOYMENTS[missionId];

    document.getElementById("deploy-eyebrow").textContent = data.eyebrow;
    document.getElementById("deploy-title").textContent = data.title;
    document.getElementById("deploy-subtitle").textContent = data.subtitle;
    document.getElementById("deploy-objective").innerHTML = data.objective;
    document.getElementById("start-mission-btn").textContent = data.btnText;

    document.getElementById("start-mission-btn").addEventListener("click", () => {
      window.location.href = "mission.html";
    });

    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const particles = Array.from({ length: 65 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.5,
      vx: (Math.random() - 0.5) * 0.25,
      vy: -Math.random() * 0.35 - 0.1,
      alpha: Math.random() * 0.5 + 0.2
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const grad = ctx.createRadialGradient(
        canvas.width * 0.5, canvas.height * 0.45, 40,
        canvas.width * 0.5, canvas.height * 0.5, Math.max(canvas.width, canvas.height) * 0.75
      );
      grad.addColorStop(0, "#0c1e35");
      grad.addColorStop(1, "#05070a");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < 0) p.y = canvas.height;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${p.alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
